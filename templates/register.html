{% extends 'layout.html' %}

{% block body_class %}auth-page{% endblock %}

{% block content %}
    <div class="container auth-container">
        <div class="card auth-card">
            <div class="card-header">
                <h1>Register</h1>
            </div>
            <div class="card-body">
            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>Email</label>
                        <input type="email" class="form-control" name="email" required >
                    </div>
                    <div class="form-group col-md-6">
                        <label>Username</label>
                        <input type="text" class="form-control" name="username" required >
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>First name</label>
                        <input type="text" class="form-control" name="firstname" required >
                    </div>
                    <div class="form-group col-md-6">
                        <label>Last name</label>
                        <input type="text" class="form-control" name="lastname" required >
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label>Role</label>
                        <input type="text" class="form-control" name="role" required >
                    </div>
                    <div class="form-group col-md-6">
                        <label>Phone number</label>
                        <input type="text" class="form-control" name="phone_number" autocomplete="phone_number" required >
                    </div>
                </div> 
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" name="password" autocomplete="new-password" required >
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" class="form-control" name="password2" autocomplete="new-password" required >
                </div>
                <button type="submit" class="btn btn-primary">Sign up</button>
                </form>
            </div>
            <div class="card-footer text-muted">
                <p>Already have an account? <a href="{{ url_for('render_login_page') }}">Login here</a></p>
            </div>
        </div>
    </div>
{% endblock %}
